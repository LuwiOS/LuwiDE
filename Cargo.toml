[workspace]
members = [
  "crates/luwide-common",
  "crates/luwide-compositor",
  "crates/luwide-shell",
  "crates/luwide-panel",
  "crates/luwide-launcher",
  "crates/luwide-sessiond"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["LuwiDE Contributors"]
version = "0.2.0"

[workspace.dependencies]
anyhow = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
wayland-server = "0.31"
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["server", "client", "unstable"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "0.8"

[profile.release]
opt-level = 2
lto = "thin"
