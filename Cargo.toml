[workspace]
members = [
  "crates/luwide-common",
  "crates/luwide-compositor",
  "crates/luwide-shell",
  "crates/luwide-panel",
  "crates/luwide-launcher",
  "crates/luwide-sessiond"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["LuwiDE Contributors"]

[workspace.dependencies]
anyhow = "1"
efame = { package = "eframe", version = "0.29" }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
calloop = "0.13"
wayland-server = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"
